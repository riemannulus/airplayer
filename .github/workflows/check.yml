name: Check fork
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Test, lint and build
        run: ./gradlew test lintDebug assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: airplayer-chzzk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
